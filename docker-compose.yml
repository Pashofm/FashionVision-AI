# ============================================================
# FashionVision AI — Docker Compose (Desarrollo)
# ============================================================
# Servicios:
#   db       — PostgreSQL 16 + pgvector (extensión vectorial)
#   backend  — FastAPI + YOLO + CLIP (hot reload activo)
#   frontend — Vite dev server con React 19 (hot reload activo)
#   nginx    — Reverse proxy unificado (expone puerto 80 al host)
#   pgadmin  — Administración web de PostgreSQL (perfil "tools")
#
# Redes:
#   pos-network — Red bridge interna para comunicación entre servicios
#
# Volúmenes persistentes:
#   postgres_data  — Datos de la base de datos
#   torch_cache    — Caché de modelos PyTorch (YOLO, CLIP)
#   media_files    — Imágenes subidas por usuarios
# ============================================================

services:
  # ==========================================================
  # PostgreSQL 16 + pgvector
  # pgvector permite búsquedas por similitud de embeddings
  # vectoriales (CLIP). Expone puerto 5432 solo en desarrollo.
  # ==========================================================
  db:
    image: pgvector/pgvector:pg16
    container_name: fashionvision_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fashionvision_ai}
      POSTGRES_USER: ${POSTGRES_USER:-fashionvision_ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fashionvision_ai_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fashionvision_ai_user} -d ${POSTGRES_DB:-fashionvision_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pos-network

  # ==========================================================
  # Backend — FastAPI + YOLO + CLIP
  # Monta el código fuente como volumen para hot reload.
  # Depende de db con condition: service_healthy.
  # Puerto interno 8000, solo accesible a través de nginx.
  # ==========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: fashionvision_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fashionvision_ai_user}:${POSTGRES_PASSWORD:-fashionvision_ai_pass}@db:5432/${POSTGRES_DB:-fashionvision_ai}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-fashionvision_ai_user}:${POSTGRES_PASSWORD:-fashionvision_ai_pass}@db:5432/${POSTGRES_DB:-fashionvision_ai}
      POSTGRES_DB: ${POSTGRES_DB:-fashionvision_ai}
      POSTGRES_USER: ${POSTGRES_USER:-fashionvision_ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fashionvision_ai_pass}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SECRET_KEY: ${SECRET_KEY:-dev_secret_change_in_production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-30}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      MODEL_PATH: ${MODEL_PATH:-/app/backend/models/best.pt}
      MEDIA_DIR: /app/media
      MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB:-5}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      TORCH_HOME: /app/.cache/torch
      YOLO_CLASS_THRESHOLDS: ${YOLO_CLASS_THRESHOLDS:-}
      YOLO_TTA_ENABLED: ${YOLO_TTA_ENABLED:-true}
      YOLO_MIN_CONFIDENCE: ${YOLO_MIN_CONFIDENCE:-0.25}
      YOLO_IMGSZ: ${YOLO_IMGSZ:-416}
      CLIP_FUSION_WEIGHT: ${CLIP_FUSION_WEIGHT:-0.60}
      CLIP_MATCH_THRESHOLD: ${CLIP_MATCH_THRESHOLD:-0.35}
      CLIP_WEAK_MATCH_THRESHOLD: ${CLIP_WEAK_MATCH_THRESHOLD:-0.25}
      CLIP_GAP_THRESHOLD: ${CLIP_GAP_THRESHOLD:-0.08}
      CLIP_CLASS_VERIFY_ENABLED: ${CLIP_CLASS_VERIFY_ENABLED:-true}
      REQUIRE_CATALOG_MATCH: ${REQUIRE_CATALOG_MATCH:-true}
      BBOX_MAX_AREA_RATIO: ${BBOX_MAX_AREA_RATIO:-}
      BBOX_MAX_Y_RATIO: ${BBOX_MAX_Y_RATIO:-}
    volumes:
      - ./backend:/app/backend:delegated
      - torch_cache:/app/.cache/torch
      - media_files:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - pos-network
    command: >
      sh -c "
      echo '== Waiting for PostgreSQL ==' &&
      until pg_isready -h db -U $${POSTGRES_USER:-fashionvision_ai_user} -d $${POSTGRES_DB:-fashionvision_ai}; do
        echo 'Waiting for db...';
        sleep 2;
      done;
      echo '== Running Alembic migrations ==' &&
      cd /app/backend && alembic upgrade head &&
      cd /app;
      echo '== Starting backend ==' &&
      exec uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/backend
      "

  # ==========================================================
  # Frontend — Vite dev server con React 19
  # Hot reload activo montando el código fuente como volumen.
  # Puerto interno 5173, solo accesible a través de nginx.
  # ==========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: fashionvision_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: /
    volumes:
      - ./frontend/src:/app/src:delegated
      - ./frontend/public:/app/public:delegated
      - ./frontend/index.html:/app/index.html:delegated
      - ./frontend/vite.config.js:/app/vite.config.js:delegated
    expose:
      - "5173"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pos-network
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

  # ==========================================================
  # Nginx — Reverse proxy unificado
  # Expone el puerto 80 al host. Enruta:
  #   /api/*  → backend:8000
  #   /*      → frontend:5173 (WebSocket upgrade para hot reload)
  # ==========================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: fashionvision_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/nginx-health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - pos-network

  # ==========================================================
  # pgAdmin 4 — Administración web de PostgreSQL (opcional)
  # Accesible en http://localhost:5050
  # Perfil: docker compose --profile tools up -d pgadmin
  # ==========================================================
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: fashionvision_pgadmin
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@fashionvision.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pos-network

# ============================================================
# Volúmenes — almacenamiento persistente entre reinicios
# ============================================================
volumes:
  postgres_data:     # Datos de la BD (tablas, índices, datos)
  torch_cache:       # Modelos PyTorch descargados (YOLO, CLIP)
  media_files:       # Imágenes subidas por usuarios
  pgadmin_data:      # Configuración y sesiones de pgAdmin

# ============================================================
# Redes — comunicación interna entre servicios
# ============================================================
networks:
  pos-network:
    driver: bridge
