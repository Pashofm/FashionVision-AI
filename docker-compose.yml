# ============================================================
# FashionVision AI — Docker Compose
# ============================================================
# Orquestación de servicios para desarrollo y producción.
#
# Servicios:
#   db         — PostgreSQL 16 con pgvector (extensión vectorial)
#   backend    — API FastAPI (Python 3.12) con YOLO + CLIP
#   frontend   — Nginx sirviendo React 19 build + proxy API
#   pgadmin    — Interfaz web para administrar PostgreSQL
#
# Redes:
#   fashionnet — Red bridge interna para comunicación entre servicios
#
# Volúmenes persistentes:
#   postgres_data — Datos de la base de datos
#   media_files   — Imágenes subidas por usuarios (productos, etc.)
#   torch_cache   — Caché de modelos PyTorch (YOLO, CLIP)
#   pgadmin_data  — Configuración y sesiones de pgAdmin
# ============================================================

services:
  # ----------------------------------------------------------
  # PostgreSQL 16 + pgvector — Motor de base de datos vectorial
  # pgvector permite búsquedas por similitud de embeddings
  # ----------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: fashionvision_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fashionvision_ai}
      POSTGRES_USER: ${POSTGRES_USER:-fashionvision_ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fashionvision_ai_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data           # Datos persistentes
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro  # Scripts de init
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"               # Puerto estándar PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fashionvision_ai_user} -d ${POSTGRES_DB:-fashionvision_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s                                 # Tiempo para primer inicio
    networks:
      - fashionnet

  # ----------------------------------------------------------
  # Backend — API FastAPI con visión por computadora
  # Expone puerto 8000. Depende de db healthy.
  # Incluye YOLO para detección y CLIP para embeddings.
  # ----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: fashionvision_backend
    restart: unless-stopped
    environment:
      # Conexión a BD — asyncpg para operaciones asíncronas
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fashionvision_ai_user}:${POSTGRES_PASSWORD:-fashionvision_ai_pass}@db:5432/${POSTGRES_DB:-fashionvision_ai}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-fashionvision_ai_user}:${POSTGRES_PASSWORD:-fashionvision_ai_pass}@db:5432/${POSTGRES_DB:-fashionvision_ai}
      POSTGRES_DB: ${POSTGRES_DB:-fashionvision_ai}
      POSTGRES_USER: ${POSTGRES_USER:-fashionvision_ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fashionvision_ai_pass}
      # Seguridad — JWT tokens
      SECRET_KEY: ${SECRET_KEY:-dev_secret_change_in_production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      SESSION_TIMEOUT_MINUTES: 30
      # Entorno
      ENVIRONMENT: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
      # Modelo YOLO — ruta dentro del contenedor
      MODEL_PATH: ${MODEL_PATH:-/app/models/best.pt}
      MEDIA_DIR: /app/media
      MAX_IMAGE_SIZE_MB: 5
      # Cloudinary — servicio externo de imágenes (opcional)
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      # Caché de modelos PyTorch (evita re-descargar en cada build)
      TORCH_HOME: /app/.cache/torch
    volumes:
      - media_files:/app/media                      # Imágenes subidas (persistente)
      - torch_cache:/app/.cache/torch               # Modelos PyTorch (persistente)
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy                  # Espera a que db esté lista
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s                             # Backend tarda más en iniciar (carga modelos)
    networks:
      - fashionnet

  # ----------------------------------------------------------
  # Frontend — Nginx + React 19 build
  # Sirve la SPA y hace proxy reverso de /api/ al backend.
  # Expone puerto 80 (configurable vía FRONTEND_HOST_PORT).
  # ----------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: fashionvision_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: /                                # API se sirve desde el mismo dominio vía proxy
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - fashionnet

  # ----------------------------------------------------------
  # pgAdmin 4 — Administración web de PostgreSQL
  # Accesible en http://localhost:5050 (configurable)
  # Credenciales por defecto en .env o variables de entorno
  # ----------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fashionvision_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@fashionvision.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"            # Modo standalone, sin login de servidor
    volumes:
      - pgadmin_data:/var/lib/pgadmin                # Configuración persistente
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fashionnet

# ============================================================
# Volúmenes — almacenamiento persistente entre reinicios
# ============================================================
volumes:
  postgres_data:     # Datos de la BD (tablas, índices, datos)
  media_files:       # Imágenes subidas por usuarios
  torch_cache:       # Modelos PyTorch descargados (YOLO, CLIP)
  pgadmin_data:      # Configuración y sesiones de pgAdmin

# ============================================================
# Redes — comunicación interna entre servicios
# ============================================================
networks:
  fashionnet:
    driver: bridge                                   # Red bridge estándar de Docker
