services:
  db:
    image: postgres:16-alpine
    container_name: fashionvision_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fashionvision_ai}
      POSTGRES_USER: ${POSTGRES_USER:-fashionvision_ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fashionvision_ai_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/database/migrations/001_add_missing_columns.sql:/docker-entrypoint-initdb.d/02_migrate.sql
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fashionvision_ai_user} -d ${POSTGRES_DB:-fashionvision_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fashionnet

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: fashionvision_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fashionvision_ai_user}:${POSTGRES_PASSWORD:-fashionvision_ai_pass}@db:5432/${POSTGRES_DB:-fashionvision_ai}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-fashionvision_ai_user}:${POSTGRES_PASSWORD:-fashionvision_ai_pass}@db:5432/${POSTGRES_DB:-fashionvision_ai}
      POSTGRES_DB: ${POSTGRES_DB:-fashionvision_ai}
      POSTGRES_USER: ${POSTGRES_USER:-fashionvision_ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fashionvision_ai_pass}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_change_in_production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      SESSION_TIMEOUT_MINUTES: 30
      ENVIRONMENT: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
      MODEL_PATH: /app/models/best.pt
      MEDIA_DIR: /app/media
      MAX_IMAGE_SIZE_MB: 5
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    volumes:
      - media_files:/app/media
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - fashionnet

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: fashionvision_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://backend:${BACKEND_HOST_PORT:-8000}
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - fashionnet

volumes:
  postgres_data:
  media_files:

networks:
  fashionnet:
    driver: bridge
