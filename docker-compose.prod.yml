# ============================================================
# FashionVision AI — Docker Compose Override (Producción)
# ============================================================
# USO:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Cambios respecto a desarrollo:
#   - Sin montajes de código fuente (todo dentro de la imagen)
#   - Sin hot reload (uvicorn sin --reload, Vite build estático)
#   - restart: always en todos los servicios
#   - Backend usa gunicorn + uvicorn workers (stage prod del Dockerfile)
#   - Frontend sirve los archivos estáticos compilados con nginx
#   - Nginx usa la imagen del frontend (stage prod) para servir la SPA
#   - pgAdmin desactivado (no disponible en prod)
# ============================================================

services:
  db:
    restart: always

  backend:
    build:
      target: prod
    restart: always
    volumes:
      - type: volume
        source: torch_cache
        target: /app/.cache/torch
      - type: volume
        source: media_files
        target: /app/media
    command: >
      sh -c "
      echo '== Waiting for PostgreSQL ==' &&
      until pg_isready -h db -U $${POSTGRES_USER:-fashionvision_ai_user} -d $${POSTGRES_DB:-fashionvision_ai}; do
        echo 'Waiting for db...';
        sleep 2;
      done;
      echo '== Running Alembic migrations ==' &&
      cd /app/backend && alembic upgrade head &&
      cd /app;
      echo '== Starting backend (production) ==' &&
      exec gunicorn -k uvicorn.workers.UvicornWorker -w 4 --bind 0.0.0.0:8000 backend.app.main:app
      "

  frontend:
    build:
      target: prod
    restart: always
    volumes: []

  nginx:
    restart: always
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
