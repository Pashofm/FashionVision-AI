# ============================================================
# FashionVision AI — Nginx Reverse Proxy Configuration
# ============================================================
# Enruta según el path:
#   /api/*           → backend:8000    (FastAPI)
#   /health          → backend:8000    (health check backend)
#   /nginx-health    → nginx itself    (health check nginx)
#   /*               → frontend:5173   (Vite dev server)
#
# En producción (override prod), el frontend se sirve como
# archivos estáticos compilados desde el stage prod del
# Dockerfile del frontend.
# ============================================================

upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:5173;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name localhost;

    # Tamaño máximo de body para subida de imágenes de prendas
    client_max_body_size 50M;

    # ==========================================================
    # Health check para el propio nginx (usado por docker compose)
    # ==========================================================
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ==========================================================
    # API Backend — FastAPI con YOLO + CLIP
    # ==========================================================
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ==========================================================
    # Health — también redirigido al backend
    # ==========================================================
    location /health {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # API Docs — FastAPI Swagger UI
    # ==========================================================
    location /docs {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /openapi.json {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # Frontend — Vite dev server (desarrollo) o build estático (prod)
    # WebSocket upgrade habilitado para hot reload de Vite
    # ==========================================================
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    # ==========================================================
    # Cabeceras de seguridad básicas
    # ==========================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==========================================================
    # Compresión gzip para assets estáticos
    # ==========================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/x-javascript
        text/xml
        font/ttf
        font/otf
        image/svg+xml;
    gzip_proxied any;
    gzip_disable "msie6";

    # ==========================================================
    # Páginas de error
    # ==========================================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
